[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-backtest"
version = "0.1.0"
description = "Kairos Backtest —— 自研轻量级量化回测框架（向量化 + 事件驱动）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bruce848647703" }]
keywords = ["quant", "backtest", "finance", "vectorized", "event-driven"]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["kairos_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
